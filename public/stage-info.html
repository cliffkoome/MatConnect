<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Arrivals</title>
  <link rel="stylesheet" href="./styles/stage-info.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700;900&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <script src="https://kit.fontawesome.com/8c27d1b0fd.js" crossorigin="anonymous"></script>
  <script src="./scripts/stage-info.js" defer></script>
</head>

<body>
  <div class="page-wrapper">
    <header class="site-header">
      <div class="container header-content">
        <a class="logo" href="index.html">MatConnect</a>
        <nav class="main-nav">
          <ul>
            <li><a href="select-stage.html" class="active">Pickup Points</a></li>
            <li><a href="feedback-page.html">Feedback</a></li>
          </ul>
        </nav>
        <div class="header-actions">
          <div class="user-profile">
            <img alt="User profile picture" class="profile-icon" src="./images/pfp.jpg"
              onclick="location='user-profile.html'">
          </div>
          <button class="mobile-menu-btn">
            <span class="material-symbols-outlined">menu</span>
          </button>
        </div>
      </div>
    </header>

    <main class="container">
      <div class="page-header">
        <h2 id="stage-name-header">Loading Stage...</h2>
        <div class="page-header-actions">
          <button class="icon-button" id="notification-bell" title="Toggle SMS alerts">
            <span class="material-symbols-outlined">notifications_off</span>
          </button>
        </div>
      </div>

      <div class="filter-container">
        <label for="destination-select">Filter by Destination</label>
        <select id="destination-select" class="form-select">
          <option value="all">-- All Destinations --</option>
          <!-- Options will be populated by JavaScript -->
        </select>
      </div>

      <ul class="arrival-list">
        <li class="info-message">Loading live arrivals...</li>
      </ul>
    </main>

    <footer class="site-footer" style="text-align: center; padding: 2rem; color: #6b7280; font-size: 0.875rem;">
      <p>© 2025 MatConnect. All rights reserved.</p>
    </footer>
  </div>
</body>

</html>
