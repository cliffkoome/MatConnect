<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedback</title>
    <link rel="stylesheet" href="styles/feedback-page.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script src="https://kit.fontawesome.com/8c27d1b0fd.js" crossorigin="anonymous"></script>
    <script src="./scripts/feedback-page.js" defer></script>
</head>
<body>
    <div class="page-wrapper">
        <header class="site-header">
            <div class="container header-content">
                <a class="logo" href="index.html">MatConnect</a>
                <nav class="main-nav">
                    <ul>
                        <!-- <li><a href="index.html">Home</a></li> -->
                        <li><a href="select-stage.html">Stages</a></li>
                        <li><a href="feedback-page.html" class="active">Feedback</a></li>
                    </ul>
                </nav>
                <div class="header-actions">
                    <div class="user-profile">
                        <img alt="User profile picture" class="profile-icon" src="./images/pfp.jpg"
                            onclick="location='user-profile.html'">
                    </div>
                    <button class="mobile-menu-btn">
                        <span class="material-symbols-outlined">menu</span>
                    </button>
                </div>
            </div>
        </header>

        <main class="main-content">
            <div class="feedback-card">
                <div class="card-header">
                    <h2>Your Feedback Matters</h2>
                    <p>Help us improve your matatu experience. Share your thoughts on your recent ride.</p>
                </div>
                <form class="feedback-form" id="feedback-form">
                    <div class="form-group">
                        <label for="vehicle-select">Select Vehicle</label>
                        <select id="vehicle-select" name="vehicle" class="form-select" required>
                            <option value="" disabled selected>Loading vehicles...</option>
                            <!-- Vehicle options will be populated by JavaScript -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="rating">Rate Your Experience</label>
                        <fieldset class="rating-stars">
                            <input type="radio" id="star5" name="rating" value="5" /><label for="star5">star</label>
                            <input type="radio" id="star4" name="rating" value="4" /><label for="star4">star</label>
                            <input type="radio" id="star3" name="rating" value="3" /><label for="star3">star</label>
                            <input type="radio" id="star2" name="rating" value="2" /><label for="star2">star</label>
                            <input type="radio" id="star1" name="rating" value="1" /><label for="star1">star</label>
                        </fieldset>
                    </div>
                    <div class="form-group">
                        <label for="comments">Your Comments</label>
                        <textarea id="comments" name="comments" class="form-textarea" placeholder="Tell us more about what you liked or what could be better..." rows="4"></textarea>
                    </div>
                    <button class="btn" type="submit">Submit Feedback</button>
                </form>
            </div>
        </main>

        <footer class="site-footer">
            <p>© 2025 Ma3Route. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
