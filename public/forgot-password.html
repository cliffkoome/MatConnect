<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MatConnect - Reset Password</title>
  <link rel="stylesheet" href="./styles/login.css">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700;900&display=swap" rel="stylesheet">
  <!-- Make sure to link to the correct script -->
  <script src="./scripts/forgot-password.js" defer></script>
</head>

<body>
  <div class="container">
    <div class="form-wrapper">
      <div class="text-center">
        <h1 class="title">Reset your Password</h1>
        <p class="subtitle" id="subtitle-text">Enter your email and we'll send you a reset link.</p>
      </div>
      <!-- Add an ID to the form -->
      <form class="form" id="reset-form">
        <div class="input-container">
          <!-- Email Input -->
          <div>
            <label for="email-address" class="sr-only">Enter your email</label>
            <input type="email" id="email-address" name="email" required placeholder="Enter your email"
              class="input input-top">
          </div>
          <!-- Token and New Password fields, initially hidden -->
          <div id="reset-fields" style="display: none;">
            <div>
              <label for="reset-token" class="sr-only">Token</label>
              <input type="text" id="reset-token" name="token" placeholder="Paste Token from Email" class="input">
            </div>
             <div>
              <label for="user-id" class="sr-only">User ID</label>
              <input type="text" id="user-id" name="id" placeholder="Paste User ID from Email" class="input">
            </div>
            <div>
              <label for="new-password" class="sr-only">New Password</label>
              <input type="password" id="new-password" name="password" placeholder="New Password" class="input input-bottom">
            </div>
          </div>
        </div>
        <div id="message-area" class="message"></div>
        <div>
          <button type="submit" class="button" id="submit-button">Send Reset Code</button>
        </div>
      </form>
       <div class="text-center" style="margin-top: 1rem;">
        <a href="/login.html" class="link">Back to Login</a>
      </div>
    </div>
  </div>
</body>

</html>
