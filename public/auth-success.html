<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Authenticating...</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  </style>
</head>
<body>
  <p>Please wait, you are being redirected...</p>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const accessToken = params.get('accessToken');
      const role = params.get('role');

      if (accessToken && role) {
        localStorage.setItem('accessToken', accessToken);
        localStorage.setItem('role', role);
        // Redirect to the appropriate dashboard based on role
        window.location.href = role === 'Admin' ? '/admin-dashboard.html' : '/select-stage.html';
      } else {
        // If tokens are missing, redirect to login with an error
        window.location.href = '/login.html?error=auth_failed';
      }
    });
  </script>
</body>
</html>
