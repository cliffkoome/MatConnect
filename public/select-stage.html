<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatConnect - Select Stage</title>
    <link rel="stylesheet" href="./styles/select-stage.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700;900&display=swap"
        rel="stylesheet">
</head>

<body>

    <header class="site-header">
        <div class="container nav-container">
            <a class="logo" href="index.html">MatConnect</a>
            <nav class="main-nav">
                <a href="select-stage.html">Stages</a>
                <a href="#">History</a>
                <a href="#">Feedback</a>
            </nav>
            <div class="user-profile">
                <img alt="User profile picture" src="./images/pfp.jpg">
            </div>
        </div>
    </header>

    <main class="container">
        <section class="stage-selector">
            <h1 class="main-title">Select Your Stage</h1>
            <div class="stage-grid">
                <a class="stage-card" href="#">
                    <div class="card-image">
                        <img alt="City Center Stage" src="./images/stage-6.jpg">
                        <div class="overlay"></div>
                    </div>
                    <div class="card-content">
                        <h3>City Center</h3>
                        <p>Downtown, Main Street</p>
                    </div>
                </a>
                <a class="stage-card" href="#">
                    <div class="card-image">
                        <img alt="Westlands Stage" src="./images/stage-1.jpg">
                        <div class="overlay"></div>
                    </div>
                    <div class="card-content">
                        <h3>Westlands</h3>
                        <p>Waiyaki Way</p>
                    </div>
                </a>
                <a class="stage-card" href="#">
                    <div class="card-image">
                        <img alt="Upper Hill Stage" src="./images/stage-2.jpeg">
                        <div class="overlay"></div>
                    </div>
                    <div class="card-content">
                        <h3>Upper Hill</h3>
                        <p>Hospital Road</p>
                    </div>
                </a>
                <a class="stage-card" href="#">
                    <div class="card-image">
                        <img alt="Karen Stage" src="./images/stage-3.jpg">
                        <div class="overlay"></div>
                    </div>
                    <div class="card-content">
                        <h3>Karen</h3>
                        <p>Karen Shopping Centre</p>
                    </div>
                </a>
                <a class="stage-card" href="#">
                    <div class="card-image">
                        <img alt="Rongai Stage" src="./images/stage-4.jpeg">
                        <div class="overlay"></div>
                    </div>
                    <div class="card-content">
                        <h3>Rongai</h3>
                        <p>Maasai Lodge Road</p>
                    </div>
                </a>
                <a class="stage-card" href="#">
                    <div class="card-image">
                        <img alt="Thika Stage" src="./images/stage-5.jpg">
                        <div class="overlay"></div>
                    </div>
                    <div class="card-content">
                        <h3>Thika</h3>
                        <p>Thika Town</p>
                    </div>
                </a>
            </div>
        </section>
    </main>

</body>

</html>
